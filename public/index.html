<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="./favicon-sun.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="description" content="Tableau de bord du Service Center ANAVEO – Interface Oktoberfest Edition. Suivi en temps réel des opérations." />
  <meta name="theme-color" content="#1a120b" />
  <title>🍺OKTOBERFEST🍺</title>

  <!-- 🦉🍺 Polices : Rye (Style Brasserie Bavaroise) + Inter/Montserrat (Pro & Data) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Montserrat:wght@500;700;800&family=Rye&display=swap" rel="stylesheet">

  <style>
    /* =========================================
       VARIABLES THÈME OKTOBERFEST PRO
       ========================================= */
    :root {
      /* Fonds : Nuit chaude sous la tente & Bois sombre */
      --bg-primary: #0f0a06;
      --bg-secondary: #1e140d;
      --bg-tertiary: #2c1e12;
      
      /* Accents : Bière Ambrée, Mousse & Bavarois */
      --accent-amber: #ffaa00;
      --accent-amber-dim: rgba(255, 170, 0, 0.15);
      --accent-foam: #fff8e7;
      --accent-bavarian-blue: #0044cc;
      --accent-bavarian-dim: rgba(0, 68, 204, 0.15);
      --accent-glow: 0 0 20px rgba(255, 170, 0, 0.3), 0 0 40px rgba(255, 248, 231, 0.1);
      
      /* Texte */
      --text-primary: #fff8e7;
      --text-secondary: #d4c5a9;
      --text-muted: #8a7b6b;
      
      /* États */
      --state-success: #4ade80;
      --state-warning: #fbbf24;
      --state-error: #f87171;
      
      /* Glassmorphism "Maßkrug" (Chope givrée) */
      --glass-bg: rgba(20, 15, 10, 0.65);
      --glass-border: rgba(255, 170, 0, 0.15);
      --glass-border-hover: rgba(255, 170, 0, 0.5);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
    }

    /* =========================================
       RESET & BASE
       ========================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* =========================================
       ARRIÈRE-PLAN ATMOSPHÈRE BIETFESTZELT
       ========================================= */
    body {
      position: relative;
      background-image: 
        /* Motif subtil de losanges bavarois (très discret) */
        repeating-linear-gradient(45deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 10px, transparent 10px, transparent 20px),
        repeating-linear-gradient(-45deg, rgba(0, 68, 204, 0.02) 0px, rgba(0, 68, 204, 0.02) 10px, transparent 10px, transparent 20px),
        /* Halos de lumière chaude (Guirlandes / Ambiance) */
        radial-gradient(circle at 15% 20%, rgba(255, 170, 0, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(255, 200, 50, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(44, 30, 18, 0.8) 0%, var(--bg-primary) 100%);
      background-size: 40px 40px, 40px 40px, 100% 100%, 100% 100%, 100% 100%;
      background-attachment: fixed;
    }

    /* =========================================
       BULLES DE MOUSSE (Remplace les Data Nodes)
       ========================================= */
    .foam-bubble {
      position: fixed;
      bottom: -20px;
      width: 6px;
      height: 6px;
      background: radial-gradient(circle at 30% 30%, var(--accent-foam), var(--accent-amber));
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
      z-index: 2;
      box-shadow: 0 0 6px rgba(255, 170, 0, 0.4);
      animation: rise-bubble linear infinite;
    }

    @keyframes rise-bubble {
      0% { transform: translateY(0) scale(0.5); opacity: 0; }
      10% { opacity: 0.7; }
      50% { transform: translateY(-50vh) scale(1.2) translateX(5px); opacity: 0.5; }
      100% { transform: translateY(-110vh) scale(0.8) translateX(-5px); opacity: 0; }
    }

    /* =========================================
       ÉCRAN DE CHARGEMENT "MISE EN PERCUSSION"
       ========================================= */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: var(--bg-primary);
      z-index: 9999;
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
    }

    .loader-container {
      text-align: center;
      padding: 3rem;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: var(--glass-shadow), 0 0 60px rgba(255, 170, 0, 0.1);
      position: relative;
      overflow: hidden;
      min-width: 340px;
    }

    /* Reflet de verre sur le loader */
    .loader-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
      animation: glass-shine 3s ease-in-out infinite;
    }

    @keyframes glass-shine {
      0% { left: -100%; }
      50% { left: 150%; }
      100% { left: 150%; }
    }

    .owl-icon {
      font-size: 4.5rem;
      margin-bottom: 1rem;
      display: inline-block;
      filter: drop-shadow(0 0 15px rgba(255, 170, 0, 0.5));
      animation: owl-toast 3s ease-in-out infinite;
    }

    @keyframes owl-toast {
      0%, 100% { transform: scale(1) rotate(0deg); }
      25% { transform: scale(1.05) rotate(-3deg); }
      75% { transform: scale(1.05) rotate(3deg); }
    }

    .loader-title {
      font-family: 'Rye', serif;
      font-size: 1.5rem;
      color: var(--accent-amber);
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .loader-subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin-bottom: 2rem;
      font-weight: 300;
    }

    /* Barre de progression style "Chope qui se remplit" */
    .progress-bar {
      width: 100%;
      height: 12px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255, 170, 0, 0.2);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(to top, #cc8800, var(--accent-amber));
      border-radius: 6px;
      box-shadow: 0 0 15px var(--accent-amber);
      animation: pour-beer 2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      position: relative;
    }

    /* Mousse au sommet de la barre de progression */
    .progress-fill::after {
      content: '';
      position: absolute;
      top: -2px;
      left: 0;
      width: 100%;
      height: 4px;
      background: var(--accent-foam);
      border-radius: 4px;
      box-shadow: 0 0 8px var(--accent-foam);
    }

    @keyframes pour-beer {
      0% { width: 0%; }
      60% { width: 85%; }
      80% { width: 92%; }
      100% { width: 100%; }
    }

    /* =========================================
       COMPOSANTS GLASSMORPHISM "MAßKRUG"
       ========================================= */
    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-top: 3px solid rgba(255, 248, 231, 0.6); /* Effet mousse sur le bord supérieur */
      border-radius: 16px;
      box-shadow: var(--glass-shadow);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .glass-panel:hover {
      border-color: var(--glass-border-hover);
      box-shadow: var(--glass-shadow), 0 0 40px rgba(255, 170, 0, 0.15);
      transform: translateY(-4px);
    }

    /* Reflet subtil sur les panneaux au hover */
    .glass-panel::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.03), transparent);
      transition: left 0.6s ease;
    }
    .glass-panel:hover::after {
      left: 150%;
    }

    /* =========================================
       TYPOGRAPHIE & UTILITAIRES
       ========================================= */
    h1, h2, h3, h4 {
      font-family: 'Montserrat', sans-serif;
      color: var(--text-primary);
      font-weight: 700;
    }

    .font-bavarian { font-family: 'Rye', serif; }
    .font-tech { font-family: 'Inter', sans-serif; }
    
    .text-amber { color: var(--accent-amber); }
    .text-foam { color: var(--accent-foam); }
    .text-bavarian { color: #4d88ff; }
    .text-muted { color: var(--text-muted); }
    
    .text-glow {
      text-shadow: 0 0 15px rgba(255, 170, 0, 0.4);
    }

    .btn-oktoberfest {
      background: linear-gradient(135deg, rgba(255, 170, 0, 0.15), rgba(255, 248, 231, 0.05));
      color: var(--accent-amber);
      border: 1px solid rgba(255, 170, 0, 0.4);
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .btn-oktoberfest:hover {
      background: linear-gradient(135deg, rgba(255, 170, 0, 0.3), rgba(255, 248, 231, 0.1));
      border-color: var(--accent-foam);
      box-shadow: 0 0 25px rgba(255, 170, 0, 0.3);
      transform: translateY(-2px);
      color: var(--accent-foam);
    }

    /* =========================================
       CONTENEUR REACT & SCROLLBAR
       ========================================= */
    #root {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      width: 100%;
    }

    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--bg-tertiary);
      border-radius: 5px;
      border: 2px solid var(--bg-primary);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent-amber);
    }
  </style>
</head>
<body>
  <!-- 🍺 Conteneur des bulles de mousse (généré par JS) -->
  <div id="bubbles-container"></div>

  <!-- ⚡ Écran de chargement "Brasserie Analytique" -->
  <div id="loading-screen">
    <div class="loader-container">
      <div class="owl-icon">🦉🍺</div>
      <div class="loader-title">BRASSERIE ANALYTIQUE</div>
      <div class="loader-subtitle">Mise en percussion des fûts de données ANAVEO...</div>
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
    </div>
  </div>

  <!-- ✅ Point de montage React -->
  <div id="root"></div>

  <!-- 🧠 Scripts -->
  <script>
    // 1. Gestion du chargement avec effet de fondu fluide
    window.addEventListener('load', () => {
      setTimeout(() => {
        const loader = document.getElementById('loading-screen');
        if (loader) {
          loader.style.opacity = '0';
          loader.style.visibility = 'hidden';
          setTimeout(() => loader.remove(), 800);
        }
      }, 2200); // Temps calé pour apprécier l'animation de "remplissage"
    });

    // 2. Génération optimisée des "Bulles de Mousse" (Remplace les Data Nodes)
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('bubbles-container');
      const bubbleCount = 50; // Nombre de bulles pour un effet pétillant

      for (let i = 0; i < bubbleCount; i++) {
        const bubble = document.createElement('div');
        bubble.className = 'foam-bubble';
        
        // Position et timing aléatoires pour un effet de carbonatation naturel
        bubble.style.left = `${Math.random() * 100}%`;
        bubble.style.animationDelay = `${Math.random() * 6}s`;
        bubble.style.animationDuration = `${5 + Math.random() * 7}s`;
        
        // Variation subtile de taille et de couleur (Mousse ou Ambré)
        const size = 4 + Math.random() * 6;
        bubble.style.width = `${size}px`;
        bubble.style.height = `${size}px`;
        
        if (Math.random() > 0.6) {
          bubble.style.background = 'radial-gradient(circle at 30% 30%, #ffffff, #ffdd88)';
          bubble.style.boxShadow = '0 0 8px rgba(255, 255, 255, 0.6)';
        }
        
        container.appendChild(bubble);
      }
    });
  </script>
</body>
</html>
