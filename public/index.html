<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="./favicon-rose.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="description" content="Tableau de bord du Service Center ANAVEO – Interface Octobre Rose Edition. Ensemble contre le cancer du sein." />
  <meta name="theme-color" content="#c2185b" />
  <title>🎀 OCTOBRE ROSE 🎀 | Service Center ANAVEO</title>

  <!-- 🦉🎀 Polices : Dancing Script (Calligraphie élégante) + Inter/Montserrat (Pro & Data) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Inter:wght@300;400;500;600&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">

  <style>
    /* =========================================
       VARIABLES THÈME OCTOBRE ROSE PRO
       ========================================= */
    :root {
      /* Fonds : Nuit douce et profonde, nuances de prune et de rose sombre */
      --bg-primary: #1a0510;
      --bg-secondary: #2d0a1e;
      --bg-tertiary: #4a0e2e;
      
      /* Accents : Rose Vif (Ruban), Rose Poudré et Or Rose */
      --accent-pink: #ff4d94;
      --accent-pink-dim: rgba(255, 77, 148, 0.15);
      --accent-soft: #ffe6f0;
      --accent-rose-gold: #d4849c;
      --accent-glow: 0 0 20px rgba(255, 77, 148, 0.4), 0 0 40px rgba(255, 230, 240, 0.1);
      
      /* Texte */
      --text-primary: #fff0f5;
      --text-secondary: #f8c8dc;
      --text-muted: #b37a8a;
      
      /* États (adaptés en nuances harmonieuses) */
      --state-success: #6ee7b7;
      --state-warning: #f9a8d4;
      --state-error: #fca5a5;
      
      /* Glassmorphism "Ruban de Verre" */
      --glass-bg: rgba(45, 10, 30, 0.65);
      --glass-border: rgba(255, 77, 148, 0.2);
      --glass-border-hover: rgba(255, 77, 148, 0.6);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
    }

    /* =========================================
       RESET & BASE
       ========================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* =========================================
       ARRIÈRE-PLAN ATMOSPHÈRE BOKEH & LUMIÈRE
       ========================================= */
    body {
      position: relative;
      background-image: 
        /* Halos de lumière douce (Effet Bokeh de l'image) */
        radial-gradient(circle at 15% 20%, rgba(255, 77, 148, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 85% 80%, rgba(212, 132, 156, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(74, 14, 46, 0.6) 0%, var(--bg-primary) 100%);
      background-size: 100% 100%, 100% 100%, 100% 100%;
      background-attachment: fixed;
    }

    /* =========================================
       PARTICULES DE LUMIÈRE (Effet Bokeh animé)
       ========================================= */
    .bokeh-particle {
      position: fixed;
      bottom: -20px;
      width: 6px;
      height: 6px;
      background: radial-gradient(circle at 30% 30%, var(--accent-soft), var(--accent-pink));
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
      z-index: 2;
      box-shadow: 0 0 8px rgba(255, 77, 148, 0.6);
      animation: float-particle linear infinite;
    }

    @keyframes float-particle {
      0% { transform: translateY(0) scale(0.5); opacity: 0; }
      10% { opacity: 0.6; }
      50% { transform: translateY(-50vh) scale(1.5) translateX(10px); opacity: 0.4; }
      100% { transform: translateY(-110vh) scale(0.8) translateX(-10px); opacity: 0; }
    }

    /* =========================================
       ÉCRAN DE CHARGEMENT "MOBILISATION"
       ========================================= */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: var(--bg-primary);
      z-index: 9999;
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
    }

    .loader-container {
      text-align: center;
      padding: 3rem;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: var(--glass-shadow), 0 0 60px rgba(255, 77, 148, 0.15);
      position: relative;
      overflow: hidden;
      min-width: 360px;
    }

    /* Reflet de verre sur le loader */
    .loader-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
      animation: glass-shine 3s ease-in-out infinite;
    }

    @keyframes glass-shine {
      0% { left: -100%; }
      50% { left: 150%; }
      100% { left: 150%; }
    }

    .owl-icon {
      font-size: 4.5rem;
      margin-bottom: 1rem;
      display: inline-block;
      filter: drop-shadow(0 0 15px rgba(255, 77, 148, 0.6));
      animation: owl-breathe 3s ease-in-out infinite;
    }

    @keyframes owl-breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .loader-title {
      font-family: 'Dancing Script', cursive;
      font-size: 2.2rem;
      color: var(--accent-pink);
      letter-spacing: 1px;
      margin-bottom: 0.25rem;
      text-shadow: 0 2px 8px rgba(255, 77, 148, 0.3);
    }

    .loader-slogan {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.85rem;
      color: var(--accent-rose-gold);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 1.5rem;
      font-weight: 600;
    }

    .loader-subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin-bottom: 2rem;
      font-weight: 300;
    }

    /* Barre de progression style "Ruban qui se déploie" */
    .progress-bar {
      width: 100%;
      height: 10px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 5px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255, 77, 148, 0.3);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #c2185b, var(--accent-pink));
      border-radius: 5px;
      box-shadow: 0 0 15px var(--accent-pink);
      animation: fill-ribbon 2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      position: relative;
    }

    /* Éclat lumineux au sommet de la barre */
    .progress-fill::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 20px;
      height: 100%;
      background: rgba(255, 255, 255, 0.6);
      filter: blur(4px);
      border-radius: 50%;
    }

    @keyframes fill-ribbon {
      0% { width: 0%; }
      60% { width: 85%; }
      80% { width: 92%; }
      100% { width: 100%; }
    }

    /* =========================================
       COMPOSANTS GLASSMORPHISM "RUBAN DE VERRE"
       ========================================= */
    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-top: 3px solid var(--accent-pink); /* Effet ruban sur le bord supérieur */
      border-radius: 16px;
      box-shadow: var(--glass-shadow);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .glass-panel:hover {
      border-color: var(--glass-border-hover);
      box-shadow: var(--glass-shadow), 0 0 40px rgba(255, 77, 148, 0.2);
      transform: translateY(-4px);
    }

    /* Reflet subtil sur les panneaux au hover */
    .glass-panel::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
      transition: left 0.6s ease;
    }
    .glass-panel:hover::after {
      left: 150%;
    }

    /* =========================================
       TYPOGRAPHIE & UTILITAIRES
       ========================================= */
    h1, h2, h3, h4 {
      font-family: 'Montserrat', sans-serif;
      color: var(--text-primary);
      font-weight: 700;
    }

    .font-calligraphy { font-family: 'Dancing Script', cursive; }
    .font-tech { font-family: 'Inter', sans-serif; }
    
    .text-rose { color: var(--accent-pink); }
    .text-soft { color: var(--accent-soft); }
    .text-gold { color: var(--accent-rose-gold); }
    .text-muted { color: var(--text-muted); }
    
    .text-glow {
      text-shadow: 0 0 15px rgba(255, 77, 148, 0.5);
    }

    .btn-octobre-rose {
      background: linear-gradient(135deg, rgba(255, 77, 148, 0.15), rgba(255, 230, 240, 0.05));
      color: var(--accent-pink);
      border: 1px solid rgba(255, 77, 148, 0.4);
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .btn-octobre-rose:hover {
      background: linear-gradient(135deg, rgba(255, 77, 148, 0.3), rgba(255, 230, 240, 0.1));
      border-color: var(--accent-soft);
      box-shadow: 0 0 25px rgba(255, 77, 148, 0.4);
      transform: translateY(-2px);
      color: var(--accent-soft);
    }

    /* =========================================
       CONTENEUR REACT & SCROLLBAR
       ========================================= */
    #root {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      width: 100%;
    }

    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--bg-tertiary);
      border-radius: 5px;
      border: 2px solid var(--bg-primary);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent-pink);
    }
  </style>
</head>
<body>
  <!-- 🎀 Conteneur des particules de lumière (généré par JS) -->
  <div id="particles-container"></div>

  <!-- ⚡ Écran de chargement "Mobilisation Octobre Rose" -->
  <div id="loading-screen">
    <div class="loader-container">
      <div class="owl-icon">🦉🎀</div>
      <div class="loader-title">Octobre Rose</div>
      <div class="loader-slogan">Ensemble contre le cancer du sein</div>
      <div class="loader-subtitle">Chargement de l'interface analytique ANAVEO...</div>
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
    </div>
  </div>

  <!-- ✅ Point de montage React -->
  <div id="root"></div>

  <!-- 🧠 Scripts -->
  <script>
    // 1. Gestion du chargement avec effet de fondu fluide
    window.addEventListener('load', () => {
      setTimeout(() => {
        const loader = document.getElementById('loading-screen');
        if (loader) {
          loader.style.opacity = '0';
          loader.style.visibility = 'hidden';
          setTimeout(() => loader.remove(), 800);
        }
      }, 2200); // Temps calé pour apprécier l'animation de chargement
    });

    // 2. Génération optimisée des "Particules de Lumière" (Effet Bokeh)
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('particles-container');
      const particleCount = 40; // Nombre de particules pour un effet élégant et non surchargé

      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'bokeh-particle';
        
        // Position et timing aléatoires pour un effet de profondeur naturel
        particle.style.left = `${Math.random() * 100}%`;
        particle.style.animationDelay = `${Math.random() * 8}s`;
        particle.style.animationDuration = `${6 + Math.random() * 8}s`;
        
        // Variation subtile de taille et d'intensité lumineuse
        const size = 4 + Math.random() * 8;
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        
        if (Math.random() > 0.7) {
          particle.style.background = 'radial-gradient(circle at 30% 30%, #ffffff, #ff99c8)';
          particle.style.boxShadow = '0 0 12px rgba(255, 153, 200, 0.8)';
        }
        
        container.appendChild(particle);
      }
    });
  </script>
</body>
</html>
